<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片处理工具 - 固定尺寸剪裁版</title>
    <script src="libs/cropper.min.js"></script>
    <link rel="stylesheet" href="libs/cropper.min.css">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;}
        body {max-width: 1400px; margin: 0 auto; padding: 20px; background: #f8f9fa;}
        .container {background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 20px;}
        h1 {text-align: center; color: #212529; margin-bottom: 20px; font-size: 24px; font-weight: 600;}
        .desktop-layout {display: flex; gap: 20px; align-items: flex-start;}
        .desktop-layout .preview-section {flex: 1; min-width: 300px; position: sticky; top: 20px;}
        .desktop-layout .scrollable-content {flex: 1; max-height: calc(100vh - 80px); overflow-y: auto; padding: 0;}
        .mobile-layout .preview-section {margin-bottom: 20px;}
        .mobile-layout .scrollable-content {max-height: calc(100vh - 380px); overflow-y: auto; padding-top: 15px;}
        .crop-box {
            width: 100%;
            height: 320px;
            border: 2px dashed #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .crop-box .empty-tip {color: #adb5bd; font-size: 16px; z-index: 1;}
        #image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
        }
        /* 预览覆盖层：完全覆盖剪裁框，层级最高 */
        #previewOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
            z-index: 10; /* 高于所有操作元素 */
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #previewImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .info-area {display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 15px;}
        .info-item {display: flex; flex-direction: column; align-items: center; gap: 3px;}
        .info-item label {color: #6c757d; font-size: 13px;}
        .info-item span {color: #212529; font-size: 15px; font-weight: 500;}
        .upload-area {text-align: center; margin-bottom: 20px;}
        #fileInput {display: none;}
        .upload-btn {padding: 6px 16px; background: #0d6efd; color: #fff; border: none; border-radius: 4px; font-size: 14px; transition: background 0.2s;}
        .upload-btn:hover {background: #0b5ed7;}
        .func-block {border: 1px solid #e9ecef; border-radius: 8px; padding: 18px; margin-bottom: 18px;}
        .func-block h3 {display: flex; align-items: center; gap: 8px; color: #343a40; margin-bottom: 12px; font-size: 17px;}
        .func-block h3 input {width: 18px; height: 18px; cursor: pointer;}
        .func-content {display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-left: 24px;}
        .func-content select, .func-content input {padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; outline: none; transition: border 0.2s;}
        .func-content select:focus, .func-content input:focus {border-color: #0d6efd;}
        .func-content input {width: 110px;}
        .range-container {width: 100%; margin: 8px 0;}
        .range-container input[type="range"] {width: 100%; height: 6px; background: #e9ecef; border-radius: 3px; outline: none;}
        .range-container input[type="range"]::-webkit-slider-thumb {appearance: none; width: 16px; height: 16px; background: #0d6efd; border-radius: 50%; cursor: pointer;}
        .range-value {font-size: 13px; color: #6c757d; text-align: right; margin-top: 4px;}
        .hidden {display: none !important;}
        .operate-btn {text-align: center; margin-top: 20px;}
        #resetBtn, #exportBtn, #previewBtn {padding: 6px 16px; border: none; border-radius: 4px; font-size: 14px; margin: 0 6px; transition: background 0.2s;}
        #resetBtn {background: #6c757d; color: #fff;}
        #resetBtn:hover {background: #5c636a;}
        #exportBtn {background: #198754; color: #fff;}
        #exportBtn:hover {background: #157347;}
        #previewBtn {background: #ffc107; color: #212529;}
        #previewBtn:hover {background: #ffca2c;}
        .tip {text-align: center; color: #6c757d; font-size: 13px; margin-top: 10px; line-height: 1.4;}
        .disabled {opacity: 0.5; pointer-events: none;}
        #tempCropperContainer {position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden;}
        @media (min-width: 769px) {.desktop-layout {display: flex !important;}}
        @media (max-width: 768px) {
            .crop-box {height: 220px;}
            .func-content {flex-direction: column; align-items: stretch; padding-left: 0;}
            .info-area {gap: 10px;}
            #resetBtn, #exportBtn, #previewBtn {width: 100%; margin: 5px 0;}
            .func-block {padding: 14px;}
        }
    </style>
</head>
<body>
    <div id="tempCropperContainer"></div>
    <div class="container desktop-layout" id="mainContainer">
        <div class="preview-section">
            <h1>图片处理工具</h1>
            <div class="crop-box" id="cropBox">
                <div class="empty-tip" id="emptyTip">请先选择图片</div>
                <img id="image" src="" alt="待处理图片">
                <!-- 预览覆盖层：独立于原操作界面，仅预览时显示 -->
                <div id="previewOverlay">
                    <img id="previewImage" src="" alt="最终效果预览">
                </div>
            </div>
            <div class="info-area" id="infoArea" style="display: none;">
                <div class="info-item"><label>导出分辨率</label><span id="resolution">0 × 0 px</span></div>
                <div class="info-item"><label>预估文件大小</label><span id="fileSize">0 KB</span></div>
                <div class="info-item"><label>导出格式</label><span id="exportFormat">--</span></div>
                <div class="info-item"><label>压缩质量</label><span id="exportQuality">--%</span></div>
            </div>
            <div class="operate-btn">
                <button id="previewBtn">预览最终效果</button>
            </div>
        </div>
        <div class="scrollable-content">
            <div class="upload-area">
                <label for="fileInput" class="upload-btn">选择本地图片</label>
                <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/gif,image/bmp,image/webp,image/svg+xml,image/tiff,image/x-icon">
            </div>
            <div class="func-block" id="cropBlock">
                <h3><input type="checkbox" id="cropCheck" checked> 图片裁剪</h3>
                <div class="func-content" id="cropContent">
                    <select id="aspectRatio">
                        <option value="0">自由裁剪（可拖动调整）</option>
                        <option value="origin">原比例裁剪</option>
                        <option value="1/1">1:1 正方形</option>
                        <option value="4/3">4:3</option>
                        <option value="16/9">16:9</option>
                        <option value="3/4">3:4</option>
                        <option value="9/16">9:16</option>
                        <option value="fixed">固定尺寸裁剪</option>
                    </select>
                    <!-- 固定尺寸输入框，默认隐藏 -->
                    <div id="fixedSizeInputs" class="hidden">
                        <input type="number" id="fixedW" placeholder="固定宽度(px)" min="10" value="">
                        <input type="number" id="fixedH" placeholder="固定高度(px)" min="10" value="">
                    </div>
                    <span>提示：选择固定尺寸后，输入数值即锁定剪裁框大小，仅可移动位置</span>
                </div>
            </div>
            <div class="func-block" id="compressBlock">
                <h3><input type="checkbox" id="compressCheck" checked> 图片压缩</h3>
                <div class="func-content" id="compressContent">
                    <div class="range-container">
                        <label>图片大小压缩（画质）：</label>
                        <input type="range" id="qualityRange" min="10" max="100" value="70">
                        <div class="range-value" id="qualityValue">70%</div>
                    </div>
                    <div class="range-container">
                        <label>图片尺寸等比例压缩（缩放）：</label>
                        <input type="range" id="scaleRange" min="10" max="100" value="100">
                        <div class="range-value" id="scaleValue">100%（原尺寸）</div>
                    </div>
                </div>
            </div>
            <div class="func-block" id="formatBlock">
                <h3><input type="checkbox" id="formatCheck" checked> 格式转换</h3>
                <div class="func-content" id="formatContent">
                    <select id="format">
                        <option value="jpeg">JPEG (通用)</option>
                        <option value="png">PNG (透明/无损)</option>
                        <option value="webp">WEBP (高压缩比)</option>
                        <option value="bmp">BMP (无压缩)</option>
                    </select>
                    <span>提示：关闭此功能将默认使用图片原格式导出</span>
                </div>
            </div>
            <div class="operate-btn">
                <button id="resetBtn">重置所有操作</button>
                <button id="exportBtn">导出并下载</button>
            </div>
            <p class="tip">核心特性：支持JPG/PNG/GIF/WEBP/BMP/SVG等多格式，裁剪/压缩/格式转换可单独开启，实时预览导出信息，本地运行无需服务器</p>
        </div>
    </div>
    <script>
        let cropper = null;
        let originalImage = null;
        let originalImageSrc = '';
        let originalRatio = 0;
        let originalFormat = 'jpeg';
        let isPreviewMode = false;
        let isDesktopLayout = true;
        const tempCropContainer = document.getElementById('tempCropperContainer');
        const cropBox = document.getElementById('cropBox');
        const mainContainer = document.getElementById('mainContainer');
        const previewOverlay = document.getElementById('previewOverlay'); // 预览覆盖层
        const el = {
            container: document.querySelector('.container'),
            fileInput: document.getElementById('fileInput'),
            image: document.getElementById('image'),
            previewImage: document.getElementById('previewImage'),
            emptyTip: document.getElementById('emptyTip'),
            infoArea: document.getElementById('infoArea'),
            resolution: document.getElementById('resolution'),
            fileSize: document.getElementById('fileSize'),
            exportFormat: document.getElementById('exportFormat'),
            exportQuality: document.getElementById('exportQuality'),
            cropCheck: document.getElementById('cropCheck'),
            compressCheck: document.getElementById('compressCheck'),
            formatCheck: document.getElementById('formatCheck'),
            cropContent: document.getElementById('cropContent'),
            compressContent: document.getElementById('compressContent'),
            formatContent: document.getElementById('formatContent'),
            aspectRatio: document.getElementById('aspectRatio'),
            fixedSizeInputs: document.getElementById('fixedSizeInputs'),
            fixedW: document.getElementById('fixedW'),
            fixedH: document.getElementById('fixedH'),
            qualityRange: document.getElementById('qualityRange'),
            qualityValue: document.getElementById('qualityValue'),
            scaleRange: document.getElementById('scaleRange'),
            scaleValue: document.getElementById('scaleValue'),
            format: document.getElementById('format'),
            resetBtn: document.getElementById('resetBtn'),
            exportBtn: document.getElementById('exportBtn'),
            previewBtn: document.getElementById('previewBtn')
        };
        // 功能勾选
        [el.cropCheck, el.compressCheck, el.formatCheck].forEach(check => {
            check.addEventListener('change', function() {
                const content = document.getElementById(`${this.id.replace('Check', 'Content')}`);
                content.classList.toggle('disabled', !this.checked);
                if (this.id === 'cropCheck') {
                    this.checked && originalImage ? initCropper() : (cropper && (cropper.destroy(), cropper = null, el.image.style.objectFit = 'contain'));
                }
                updateExportInfo();
            });
        });
        // 裁剪比例切换（核心修复：销毁旧裁剪器重新初始化）
        el.aspectRatio.addEventListener('change', () => {
            const isFixedMode = el.aspectRatio.value === 'fixed';
            el.fixedSizeInputs.classList.toggle('hidden', !isFixedMode);
            
            if (!cropper || !el.cropCheck.checked) return;
            
            // 先销毁原有裁剪器，避免状态残留
            cropper.destroy();
            cropper = null;
            
            // 重新初始化裁剪器，应用新模式
            initCropper();
            // 固定尺寸模式下直接应用尺寸并锁定
            if (isFixedMode && el.fixedW.value && el.fixedH.value) {
                updateFixedCropBox(true);
            }
            updateExportInfo();
        });
        // 固定尺寸输入逻辑：输入后强制锁定剪裁框
        [el.fixedW, el.fixedH].forEach(input => {
            input.addEventListener('input', () => {
                if (!cropper || !el.cropCheck.checked || el.aspectRatio.value !== 'fixed') return;
                
                const w = Number(el.fixedW.value) || 0;
                const h = Number(el.fixedH.value) || 0;
                
                if (w > 0 && h > 0) {
                    updateFixedCropBox(true); // 强制锁定
                }
                // 无论输入是否完整，固定尺寸模式下始终禁止调整
                cropper.setOptions({
                    cropBoxResizable: false
                });
                updateExportInfo();
            });
        });
        // 单独封装固定尺寸剪裁框更新函数（新增强制锁定参数）
        function updateFixedCropBox(forceLock = false) {
            const w = Math.max(Number(el.fixedW.value), 10);
            const h = Math.max(Number(el.fixedH.value), 10);
            const canvasData = cropper.getCanvasData();
            const scaleX = originalImage.width / canvasData.width;
            const scaleY = originalImage.height / canvasData.height;
            
            // 设置固定大小的剪裁框（居中显示）
            cropper.setCropBoxData({
                width: w / scaleX,
                height: h / scaleY,
                left: (canvasData.width - w / scaleX) / 2,
                top: (canvasData.height - h / scaleY) / 2
            });
            
            // 强制锁定（覆盖Cropper的默认行为）
            if (forceLock) {
                cropper.setOptions({
                    cropBoxResizable: false
                });
                // 额外通过DOM样式禁用剪裁框的调整手柄（彻底阻止调整）
                const cropBoxElement = cropper.cropBox;
                if (cropBoxElement) {
                    const resizers = cropBoxElement.querySelectorAll('.cropper-point');
                    resizers.forEach(resizer => {
                        resizer.style.pointerEvents = 'none'; // 禁用调整手柄的点击事件
                        resizer.style.opacity = '0.3'; // 视觉上提示不可调整
                    });
                }
            }
        }
        // 压缩进度条
        el.qualityRange.addEventListener('input', () => {el.qualityValue.textContent = `${el.qualityRange.value}%`; updateExportInfo();});
        el.scaleRange.addEventListener('input', () => {el.scaleValue.textContent = el.scaleRange.value === '100' ? '100%（原尺寸）' : `${el.scaleRange.value}%`; updateExportInfo();});
        // 格式切换
        el.format.addEventListener('change', updateExportInfo);
        // 选择图片
        el.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !/^image\//.test(file.type)) {
                alert('请选择有效的图片文件！支持JPG/PNG/GIF/WEBP/BMP/SVG等格式');
                return;
            }
            // 重置旧状态
            cropper && (cropper.destroy(), cropper = null);
            isPreviewMode = false;
            previewOverlay.style.display = 'none'; // 隐藏预览层
            el.previewImage.src = '';
            el.previewBtn.textContent = '预览最终效果';
            // 提取原始格式
            originalFormat = file.type.split('/')[1] || 'jpeg';
            originalFormat = originalFormat === 'jpg' ? 'jpeg' : originalFormat;
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImageSrc = event.target.result;
                originalImage = new Image();
                originalImage.src = originalImageSrc;
                originalImage.onload = () => {
                    originalRatio = originalImage.width / originalImage.height;
                    el.image.src = originalImageSrc;
                    el.image.style.display = 'block';
                    el.emptyTip.style.display = 'none';
                    el.infoArea.style.display = 'flex';
                    el.fixedSizeInputs.classList.toggle('hidden', el.aspectRatio.value !== 'fixed');
                    el.cropCheck.checked && initCropper();
                    updateExportInfo();
                };
            };
            reader.readAsDataURL(file);
        });
        // 初始化裁剪器（核心优化：严格按当前类型配置参数）
        function initCropper() {
            if (!originalImage || !el.cropCheck.checked || cropper) return;
            
            let ratio = NaN;
            let cropBoxResizable = true;
            let cropBoxMovable = true;
            
            // 严格按当前选择的类型配置
            if (el.aspectRatio.value === '0') {
                ratio = NaN; // 自由裁剪
                cropBoxResizable = true;
            } else if (el.aspectRatio.value === 'origin') {
                ratio = originalRatio; // 原比例
                cropBoxResizable = true;
            } else if (el.aspectRatio.value === 'fixed') {
                ratio = NaN; // 固定尺寸
                cropBoxResizable = false;
                cropBoxMovable = true;
            } else {
                ratio = eval(el.aspectRatio.value); // 比例裁剪（如1/1）
                cropBoxResizable = true;
            }
            
            cropper = new Cropper(el.image, {
                aspectRatio: ratio,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 0.8,
                restore: false,
                guides: true,
                center: true,
                highlight: true,
                cropBoxMovable: cropBoxMovable,
                cropBoxResizable: cropBoxResizable,
                toggleDragModeOnDblclick: true,
                crop: updateExportInfo
            });
            
            // 固定尺寸模式初始化时应用尺寸
            if (el.aspectRatio.value === 'fixed' && el.fixedW.value && el.fixedH.value) {
                updateFixedCropBox(true);
            }
        }
        // 更新导出信息
        function updateExportInfo() {
            if (!originalImage) return;
            const isCrop = el.cropCheck.checked;
            const isCompress = el.compressCheck.checked;
            const isFormat = el.formatCheck.checked;
            const qualityVal = isCompress ? Number(el.qualityRange.value) / 100 : 1;
            const scaleVal = isCompress ? Number(el.scaleRange.value) / 100 : 1;
            const formatVal = isFormat ? el.format.value : originalFormat;
            
            let exportW = originalImage.width, exportH = originalImage.height;
            if (isCrop && cropper) {
                const canvasData = cropper.getCanvasData();
                const cropBoxData = cropper.getCropBoxData();
                const scaleX = originalImage.width / canvasData.width, scaleY = originalImage.height / canvasData.height;
                
                // 固定尺寸模式优先使用输入的尺寸
                if (el.aspectRatio.value === 'fixed' && el.fixedW.value && el.fixedH.value) {
                    exportW = Math.max(Number(el.fixedW.value), 10);
                    exportH = Math.max(Number(el.fixedH.value), 10);
                } else {
                    exportW = Math.round(cropBoxData.width * scaleX);
                    exportH = Math.round(cropBoxData.height * scaleY);
                }
            }
            
            exportW = Math.round(exportW * scaleVal);
            exportH = Math.round(exportH * scaleVal);
            
            // 预估文件大小
            const pixelCount = exportW * exportH;
            let sizeKB = 0;
            switch (formatVal) {
                case 'jpeg': case 'jpg': sizeKB = (pixelCount * qualityVal * 0.1) / 1024; break;
                case 'png': sizeKB = (pixelCount * 0.3) / 1024; break;
                case 'webp': sizeKB = (pixelCount * qualityVal * 0.05) / 1024; break;
                case 'bmp': sizeKB = (pixelCount * 3) / 1024; break;
                default: sizeKB = (pixelCount * qualityVal * 0.1) / 1024;
            }
            sizeKB = Math.max(sizeKB.toFixed(2), 0.01);
            
            el.resolution.innerText = `${exportW} × ${exportH} px`;
            el.fileSize.innerText = `${sizeKB} KB`;
            el.exportFormat.innerText = formatVal.toUpperCase();
            el.exportQuality.innerText = isCompress ? `${Math.round(qualityVal * 100)}%` : '100%（未压缩）';
        }
        // 预览最终效果（核心修改：叠加覆盖层，不销毁剪裁器）
        el.previewBtn.addEventListener('click', async () => {
            if (!originalImage) {
                alert('请先选择图片！');
                return;
            }
            if (!isPreviewMode) {
                el.previewBtn.disabled = true;
                el.previewBtn.textContent = '生成预览中...';
                try {
                    await generatePreview();
                    previewOverlay.style.display = 'flex'; // 显示覆盖层（覆盖原操作界面）
                    el.previewBtn.textContent = '返回操作视图';
                    isPreviewMode = true;
                } catch (e) {
                    console.error('预览失败：', e);
                    alert(`预览生成失败：${e.message}`);
                    el.previewBtn.textContent = '预览最终效果';
                } finally {
                    el.previewBtn.disabled = false;
                }
            } else {
                // 返回操作视图：仅隐藏覆盖层，原剪裁器和参数完全不变
                previewOverlay.style.display = 'none';
                el.previewImage.src = '';
                el.previewBtn.textContent = '预览最终效果';
                isPreviewMode = false;
                updateExportInfo(); // 刷新信息（保持同步）
            }
        });
        // 生成预览
        function generatePreview() {
            return new Promise((resolve, reject) => {
                const isCrop = el.cropCheck.checked;
                const isCompress = el.compressCheck.checked;
                const isFormat = el.formatCheck.checked;
                const qualityVal = isCompress ? Number(el.qualityRange.value) / 100 : 1;
                const scaleVal = isCompress ? Number(el.scaleRange.value) / 100 : 1;
                const formatVal = isFormat ? el.format.value : originalFormat;
                
                if (isCrop && cropper) {
                    try {
                        const canvasData = cropper.getCanvasData();
                        const cropBoxData = cropper.getCropBoxData();
                        const scaleX = originalImage.width / canvasData.width;
                        const scaleY = originalImage.height / canvasData.height;
                        
                        // 固定尺寸模式使用输入的尺寸
                        let exportW, exportH;
                        if (el.aspectRatio.value === 'fixed' && el.fixedW.value && el.fixedH.value) {
                            exportW = Math.max(Number(el.fixedW.value), 10);
                            exportH = Math.max(Number(el.fixedH.value), 10);
                        } else {
                            exportW = Math.round(cropBoxData.width * scaleX);
                            exportH = Math.round(cropBoxData.height * scaleY);
                        }
                        
                        const cropCanvas = cropper.getCroppedCanvas({width: exportW, height: exportH});
                        handleScaleAndBlob(cropCanvas, scaleVal, formatVal, qualityVal, resolve, reject);
                    } catch (e) {
                        reject(e);
                    }
                } else {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = originalImage.width;
                        canvas.height = originalImage.height;
                        canvas.getContext('2d').drawImage(originalImage, 0, 0);
                        handleScaleAndBlob(canvas, scaleVal, formatVal, qualityVal, resolve, reject);
                    } catch (e) {
                        reject(e);
                    }
                }
            });
        }
        // 处理缩放+生成Blob
        function handleScaleAndBlob(canvas, scaleVal, formatVal, qualityVal, resolve, reject) {
            try {
                let finalCanvas = canvas;
                if (scaleVal < 1 && scaleVal > 0) {
                    finalCanvas = document.createElement('canvas');
                    finalCanvas.width = Math.round(canvas.width * scaleVal);
                    finalCanvas.height = Math.round(canvas.height * scaleVal);
                    finalCanvas.getContext('2d').drawImage(canvas, 0, 0, finalCanvas.width, finalCanvas.height);
                }
                const blobFormat = formatVal === 'jpg' ? 'jpeg' : formatVal;
                finalCanvas.toBlob((blob) => {
                    if (blob) {
                        el.previewImage.src = URL.createObjectURL(blob);
                        requestAnimationFrame(() => resolve());
                    } else {
                        reject(new Error('Canvas生成Blob失败'));
                    }
                }, `image/${blobFormat}`, qualityVal);
            } catch (e) {
                reject(e);
            }
        }
        // 重置所有操作
        el.resetBtn.addEventListener('click', () => {
            // 重置勾选和样式
            el.cropCheck.checked = el.compressCheck.checked = el.formatCheck.checked = true;
            el.cropContent.classList.remove('disabled');
            el.compressContent.classList.remove('disabled');
            el.formatContent.classList.remove('disabled');
            // 重置参数
            el.aspectRatio.value = 0;
            el.fixedW.value = el.fixedH.value = '';
            el.qualityRange.value = 70;
            el.qualityValue.textContent = '70%';
            el.scaleRange.value = 100;
            el.scaleValue.textContent = '100%（原尺寸）';
            el.format.value = 'jpeg';
            el.fixedSizeInputs.classList.add('hidden');
            // 重置裁剪和预览
            cropper && (cropper.destroy(), cropper = null);
            isPreviewMode = false;
            previewOverlay.style.display = 'none';
            el.previewImage.src = '';
            el.previewBtn.textContent = '预览最终效果';
            // 重置图片
            if (originalImage) {
                el.image.src = originalImageSrc;
                el.image.style.display = 'block';
                el.image.style.objectFit = 'contain';
                el.emptyTip.style.display = 'none';
                initCropper();
            } else {
                el.image.src = '';
                el.image.style.display = 'none';
                el.emptyTip.style.display = 'block';
                el.infoArea.style.display = 'none';
                originalFormat = 'jpeg';
            }
            // 重置文件输入
            el.fileInput.value = '';
            updateExportInfo();
        });
        // 导出并下载
        el.exportBtn.addEventListener('click', () => {
            if (!originalImage) {
                alert('请先选择图片！');
                return;
            }
            try {
                const isCrop = el.cropCheck.checked;
                const isCompress = el.compressCheck.checked;
                const isFormat = el.formatCheck.checked;
                const qualityVal = isCompress ? Number(el.qualityRange.value) / 100 : 1;
                const scaleVal = isCompress ? Number(el.scaleRange.value) / 100 : 1;
                const formatVal = isFormat ? el.format.value : originalFormat;
                let canvas;
                
                // 裁剪处理
                if (isCrop && cropper) {
                    const canvasData = cropper.getCanvasData();
                    const cropBoxData = cropper.getCropBoxData();
                    const scaleX = originalImage.width / canvasData.width;
                    const scaleY = originalImage.height / canvasData.height;
                    
                    // 固定尺寸模式使用输入的尺寸
                    let exportW, exportH;
                    if (el.aspectRatio.value === 'fixed' && el.fixedW.value && el.fixedH.value) {
                        exportW = Math.max(Number(el.fixedW.value), 10);
                        exportH = Math.max(Number(el.fixedH.value), 10);
                    } else {
                        exportW = Math.round(cropBoxData.width * scaleX);
                        exportH = Math.round(cropBoxData.height * scaleY);
                    }
                    
                    canvas = cropper.getCroppedCanvas({width: exportW, height: exportH});
                } else {
                    canvas = document.createElement('canvas');
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    canvas.getContext('2d').drawImage(originalImage, 0, 0);
                }
                
                // 缩放处理
                if (scaleVal < 1 && scaleVal > 0) {
                    const scaledCanvas = document.createElement('canvas');
                    scaledCanvas.width = Math.round(canvas.width * scaleVal);
                    scaledCanvas.height = Math.round(canvas.height * scaleVal);
                    scaledCanvas.getContext('2d').drawImage(canvas, 0, 0, scaledCanvas.width, scaledCanvas.height);
                    canvas = scaledCanvas;
                }
                
                // 生成文件并下载
                const blobFormat = formatVal === 'jpg' ? 'jpeg' : formatVal;
                canvas.toBlob((blob) => {
                    if (!blob) {
                        alert('图片处理失败，请调整参数重试！');
                        return;
                    }
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `processed_${new Date().getTime()}.${formatVal}`;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert(`图片已以${formatVal.toUpperCase()}格式导出成功！`);
                }, `image/${blobFormat}`, qualityVal);
            } catch (e) {
                console.error('导出失败：', e);
                alert(`导出失败：${e.message}`);
            }
        });
        // 窗口大小适配
        window.addEventListener('resize', () => {
            if (cropper && el.cropCheck.checked) {
                cropper.resize();
                // 调整窗口后，若为固定尺寸模式，重新强制锁定
                if (el.aspectRatio.value === 'fixed' && el.fixedW.value && el.fixedH.value) {
                    updateFixedCropBox(true);
                }
            }
        });
        // 初始化布局
        function initLayout() {
            const isWide = window.innerWidth > 768;
            isDesktopLayout = isWide;
            mainContainer.classList.toggle('desktop-layout', isWide);
            mainContainer.classList.toggle('mobile-layout', !isWide);
        }
        initLayout();
        window.addEventListener('resize', initLayout);
    </script>
</body>
