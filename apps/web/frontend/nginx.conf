server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Docker 内置 DNS；后端容器重建换 IP 后，Nginx 仍可重新解析 backend 服务名。
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_upstream http://backend:8000;

  # ZIP 上传可能较大，按需调整
  client_max_body_size 200m;

  location = /privacy {
    return 301 /privacy.html;
  }

  location = /terms {
    return 301 /terms.html;
  }

  location = /help {
    return 301 /help.html;
  }

  location = /about {
    return 301 /about.html;
  }

  location = /favicon.ico {
    return 301 /favicon.svg;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 前端固定使用 /api 前缀（见 apps/web/frontend/src/api/index.js）
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

