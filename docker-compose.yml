services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    image: convertapk-backend:latest
    environment:
      - TZ=Asia/Shanghai
      - APK_BUILDER_MODE=docker
      - APK_BUILDER_IMAGE=apk-builder:latest
      - DESKTOP_BUILDER_IMAGE=desktop-builder:latest
      - APK_BUILDER_DATA_DIR=/data
      - APK_BUILDER_DATA_VOLUME=convertapk-data
      - APK_BUILDER_GRADLE_CACHE_MODE=volume
      - APK_BUILDER_GRADLE_CACHE_VOLUME=convertapk-gradle-cache
      - APK_BUILDER_TEMPLATES_DIR=${APK_BUILDER_TEMPLATES_DIR:-/data/ConvertAPK-Desktop/templates}
      - ADMIN_API_URL=http://admin-backend:9001
      - ADMIN_CLIENT_TOKEN=client-secret
      - ADMIN_UPLOAD_TASK_INPUT_ASSETS=false
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_GITHUB_CALLBACK_URL=${AUTH_GITHUB_CALLBACK_URL:-}
      - AUTH_DEFAULT_RETURN_URL=${AUTH_DEFAULT_RETURN_URL:-}
      - AUTH_REDIRECT_ALLOWED_ORIGINS=${AUTH_REDIRECT_ALLOWED_ORIGINS:-}
      - AUTH_SMS_REDIS_URL=${AUTH_SMS_REDIS_URL:-redis://redis:6379/0}
      - AUTH_SMS_PROVIDER=${AUTH_SMS_PROVIDER:-mock}
      - AUTH_SMS_PROVIDER_WEBHOOK_URL=${AUTH_SMS_PROVIDER_WEBHOOK_URL:-}
      - AUTH_SMS_PROVIDER_WEBHOOK_TOKEN=${AUTH_SMS_PROVIDER_WEBHOOK_TOKEN:-}
      - AUTH_SMS_DEBUG_RETURN_CODE=${AUTH_SMS_DEBUG_RETURN_CODE:-false}
      - MARKETPLACE_POLICY_ENABLED=${MARKETPLACE_POLICY_ENABLED:-true}
      - MARKETPLACE_POLICY_ALLOWLIST_CLIENT_IDS=${MARKETPLACE_POLICY_ALLOWLIST_CLIENT_IDS:-}
      - OPENROUTER_DIAG_ENABLED=${OPENROUTER_DIAG_ENABLED:-true}
      - OPENROUTER_DIAG_MODEL=${OPENROUTER_DIAG_MODEL:-openrouter/elephant-alpha}
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      - OPENROUTER_DIAG_TIMEOUT_SECONDS=${OPENROUTER_DIAG_TIMEOUT_SECONDS:-20}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TASK_AI_RISK_GUARD_ENABLED=${TASK_AI_RISK_GUARD_ENABLED:-true}
      - TASK_AI_RISK_GUARD_MODEL=${TASK_AI_RISK_GUARD_MODEL:-qwen/qwen3.5-flash-02-23}
      - TASK_AI_RISK_GUARD_TIMEOUT_SECONDS=${TASK_AI_RISK_GUARD_TIMEOUT_SECONDS:-18}
      - TASK_AI_RISK_GUARD_API_KEY=${TASK_AI_RISK_GUARD_API_KEY:-}
    volumes:
      - convertapk-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - admin-backend
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    image: convertapk-frontend:latest
    depends_on:
      - backend
    ports:
      - "0.0.0.0:8080:80"
    restart: unless-stopped

  admin-db:
    image: postgres:15
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_DB=convertapk_admin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped

  admin-backend:
    build:
      context: .
      dockerfile: admin/backend/Dockerfile
    image: convertapk-admin-backend:latest
    env_file:
      - ./admin/backend/.env
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql://postgres:postgres@admin-db:5432/convertapk_admin
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - JWT_SECRET=change-me
      - CLIENT_TOKEN=client-secret
      - ADMIN_STORAGE_ROOT=admin-storage
      - CONVERTAPK_TASKS_ROOT=/data/tasks
      - CONVERTAPK_TASK_INPUTS_ROOT=/data/task-inputs
    volumes:
      - admin-storage:/app/admin/backend/admin-storage
      - convertapk-data:/data:ro
    depends_on:
      - admin-db
    ports:
      - "0.0.0.0:9001:9001"
    restart: unless-stopped

  admin-frontend:
    build:
      context: .
      dockerfile: admin/frontend/Dockerfile
    image: convertapk-admin-frontend:latest
    depends_on:
      - admin-backend
    ports:
      - "0.0.0.0:9002:80"
    restart: unless-stopped

  # Build apk-builder image on demand.
  apk-builder:
    profiles: ["builder"]
    build:
      context: apk-worker
      dockerfile: Dockerfile
    image: apk-builder:latest
    entrypoint: ["/bin/bash", "-lc", "echo 'apk-builder image is ready'; sleep infinity"]
    restart: "no"

  # Build desktop-builder image on demand.
  desktop-builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: apk-worker/desktop-builder.Dockerfile
    image: desktop-builder:latest
    entrypoint: ["/bin/bash", "-lc", "echo 'desktop-builder image is ready'; sleep infinity"]
    restart: "no"

volumes:
  convertapk-data:
    name: convertapk-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/convertapk
  convertapk-gradle-cache:
    name: convertapk-gradle-cache
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/convertapk/gradle-cache
  admin-db-data:
    name: convertapk-admin-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/convertapk-admin/db
  admin-storage:
    name: convertapk-admin-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/convertapk-admin/storage
